[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grd-framework"
version = "0.1.0"
description = "Gate-Recover-Discover: selective diagnostics for linear causal representation learning"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Gaurav Goyal" }]

# Real runtime dependencies, taken from the imports across src/ and experiments/.
# numpy, scipy and scikit-learn are imported directly; anndata is imported lazily
# inside the data loaders (h5ad reading). No exact pins; floors reflect the features
# used (scikit-learn >= 1.3 for FastICA whiten="unit-variance"). Validated on
# numpy 2.0.2, scipy 1.13.1, scikit-learn 1.6.1.
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "anndata>=0.9",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/gaurav3507/grd-framework"

# The code runs from the source tree (scripts load modules by path via importlib),
# so no package is installed by default. Package discovery is disabled to keep this
# a pure metadata and dependency declaration.
[tool.setuptools]
packages = []
